[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semitone-pianobench"
version = "1.1.0"
description = "Headless, reproducible piano transcription evaluation for Semitone"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "mido==1.3.3", "soundfile==0.13.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "mir_eval==0.8.2"]

[project.scripts]
pianobench = "pianobench.cli:main"

[tool.setuptools.packages.find]
include = ["pianobench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
